<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dotlab</title>
<link rel="stylesheet" href="themes.css">
<link rel="stylesheet" href="style.css">
<script>
  /* the chosen look, before the first paint, so the page doesn't flash Y2K Blue first */
  try { const look = JSON.parse(localStorage.getItem("dotlab:theme")); if (look) document.documentElement.dataset.theme = look; } catch (_) {}
</script>
</head>
<body>
<main class="app">
  <nav id="menubar" class="menubar" aria-label="Menu"></nav>
  <header class="banner">
    <img src="assets/icon-mark.png" alt="">
    <h1>DOTLAB</h1>
  </header>

  <section class="controls">
    <div class="presets">
      <label for="preset">Preset</label>
      <select id="preset"></select>
      <button type="button" id="preset-save" class="gel">Save…</button>
      <button type="button" id="preset-delete" class="gel" disabled>Delete</button>
      <form id="preset-name-form" class="presets-name" hidden>
        <input id="preset-name" placeholder="Preset name" maxlength="60" aria-label="Preset name" autocomplete="off">
        <button type="submit" class="gel">Save</button>
        <button type="button" id="preset-cancel" class="gel">Cancel</button>
      </form>
    </div>

    <div id="form"></div>
    <div id="output"></div>

    <!-- moved into the Output box once the form is built; the choices depend on the client -->
    <div class="field" id="printer-row" hidden>
      <label for="mode">Printer</label>
      <div class="inline">
        <select id="mode"></select>
        <input id="address" placeholder="first T003 found" aria-label="Bluetooth address" hidden>
      </div>
    </div>

    <div class="actions">
      <button id="print" disabled>Print</button>
      <p id="status" role="status">Loading…</p>
    </div>

  </section>

  <section class="stage" aria-label="Preview">
    <div class="bezel">
      <div class="screen">
        <div class="paper"><canvas id="preview" width="384" height="224" aria-label="Label preview"></canvas></div>
        <div class="gap" aria-hidden="true">gap between stickers, not printed</div>
      </div>
    </div>
    <p id="hint" role="note" hidden></p>
    <div class="stage-tools">
      <select id="export-size" aria-label="Image size"></select>
      <button type="button" id="save-image" class="gel">Save image</button>
      <button type="button" id="copy-image" class="gel">Copy image</button>
    </div>
    <div class="stage-tools">
      <button type="button" id="open-label" class="gel">Open label…</button>
      <button type="button" id="save-label" class="gel">Save label…</button>
      <input type="file" id="label-file" accept=".png,image/png" hidden>
    </div>
  </section>
</main>
<dialog id="about" aria-labelledby="about-title">
  <h2 id="about-title"></h2>
  <p>Design and print labels on the ORGBRO T003 thermal label printer.</p>
  <p id="about-details"></p>
  <p>MIT licence · <a id="about-repo" href="#">GitHub repository</a> · <a id="about-licenses" href="licenses.txt" target="_blank" rel="noopener">Font licences</a></p>
  <form method="dialog"><button class="gel" autofocus>Close</button></form>
</dialog>
<noscript>This app needs JavaScript.</noscript>
<script type="module" src="main.js"></script>
</body>
</html>
