[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "t003-label-gui"
dynamic = ["version"]
description = "Desktop GUI for printing to the ORGBRO T003 thermal label printer over raw USB (TSPL)"
requires-python = ">=3.9"
# The core and the CLI need no window toolkit, so they install anywhere Python runs; the window is the optional "web" extra.
dependencies = [
    "pillow>=9.1",
    "pyusb>=1.2.1",
    "qrcode>=7.4",
    "fonttools>=4.30",
    "bleak>=0.22; sys_platform != 'linux'",  # Bluetooth (BLE) printing on Windows and macOS; Linux uses RFCOMM sockets
    # Bundles libusb for Windows, macOS and Linux x86-64/arm64. Elsewhere pip would try to build it from source, which
    # fails; there the code falls back to the system libusb (apt/dnf/pkg install libusb). Not older than 1.0.30:
    # every 1.0.26.x library is rejected by pyusb on a machine with no system libusb (found with a CI probe).
    "libusb-package>=1.0.30; platform_system == 'Windows' or platform_system == 'Darwin' or (platform_system == 'Linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64' or platform_machine == 'AMD64'))",
]

[project.optional-dependencies]
# The web UI in a native window: `t003-gui --web`. Windows (WebView2) and macOS (WKWebView) use what the system has. Linux
# uses WebKitGTK if the system has it (webkit2gtk and PyGObject from the distro: small), else `web-qt` brings QtWebEngine.
web = ["pywebview>=5.3"]
web-qt = ["pywebview[pyside6]>=5.3"]
dev = ["pytest"]

[project.scripts]
t003-gui = "t003gui.launcher:main"
t003-print = "t003gui.cli:main"

[tool.setuptools.dynamic]
version = {attr = "t003gui.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
t003gui = ["fonts/*.ttf", "fonts/LICENSES/*", "assets/*", "web/*.html", "web/*.css", "web/*.js", "web/*.mjs", "web/*/*.js", "web/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
