[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dotlab"
dynamic = ["version"]
description = "Label designer (web app and CLI) for printing to the ORGBRO T003 thermal label printer over Bluetooth (TSPL)"
requires-python = ">=3.9"
# The core and the CLI need no window toolkit, so they install anywhere Python runs; the window is the optional "web" extra.
dependencies = [
    "pillow>=9.1",
    "qrcode>=7.4",
    "fonttools>=4.30",
    "bleak>=0.22; sys_platform != 'linux'",  # Bluetooth (BLE) printing on Windows and macOS; Linux uses RFCOMM sockets
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dotlab-print = "dotlab.cli:main"

[tool.setuptools.dynamic]
version = {attr = "dotlab.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dotlab = ["fonts/*.ttf", "fonts/LICENSES/*", "assets/*", "web/*.html", "web/*.css", "web/*.js", "web/*.mjs", "web/*/*.js", "web/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
