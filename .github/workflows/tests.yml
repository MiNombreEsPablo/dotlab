name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:  # the oldest and newest Python on Linux, and the newest on the other two systems
          - { os: ubuntu-22.04, python: "3.9" }
          - { os: ubuntu-22.04, python: "3.13" }
          - { os: windows-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  # The oldest versions we claim to support, so the lower bounds in pyproject.toml are tested, not guessed.
  minimum-versions:
    name: Oldest supported libraries (Python 3.10)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "pillow==9.1.0" "qrcode==7.4" "fonttools==4.30.0" pytest
      - run: python -m pip install -e . --no-deps
      - run: python -m pytest -q

  # What users actually get from pip: build the wheel and sdist, install the wheel (not the source tree) into a clean
  # environment, and run the self-test, which fails if a font, icon or licence is missing from the package.
  package:
    name: Wheel installs and runs
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: The sdist has the data files too
        run: |
          python - <<'PY'
          import glob, tarfile
          names = tarfile.open(glob.glob("dist/*.tar.gz")[0]).getnames()
          for needle in ("assets/icon.svg", "assets/icon-256.png", "fonts/DejaVuSans-Bold.ttf", "LICENSES/LICENSE.dejavu"):
              assert any(n.endswith(needle) for n in names), f"sdist is missing {needle}"
          PY
      - name: Install the wheel in a clean environment and self-test it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install "$(ls dist/*.whl)"
          cd /tmp
          /tmp/clean/bin/dotlab-print --version
          /tmp/clean/bin/dotlab-print "Hello" --qr https://example.com --preview /tmp/label.png

  # The web app runs the very same Python in the browser (Pyodide). Render a fixed set of labels in Pyodide and natively
  # and compare the dots, so the two engines can't drift apart unnoticed. Also runs the Node tests of the doodle engine
  # (the other jobs' Node is too old for them, and they skip).
  web-parity:
    name: The web engine draws what the native one does
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Pyodide, the version the site uses
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src/dotlab/web'); import dev_server; print(dev_server.PYODIDE)")
          mkdir -p "$RUNNER_TEMP/pyodide" && cd "$RUNNER_TEMP/pyodide" && npm init -y >/dev/null && npm install "pyodide@$version"
      - run: python -m pytest -q tests/test_web_parity.py tests/test_web_js.py
        env:
          DOTLAB_PARITY_PYODIDE: ${{ runner.temp }}/pyodide
