name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The oldest Python with the oldest libraries we claim in pyproject.toml (so the lower bounds are tested, not guessed),
  # and the newest of both. Linux only: nothing in the code is OS-specific any more (printing happens in the browser).
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Python 3.9, oldest libraries", python: "3.9", install: 'pip install "pillow==9.1.0" "qrcode==7.4" "fonttools==4.30.0" pytest && pip install -e . --no-deps' }
          - { name: "Python 3.13, newest libraries", python: "3.13", install: 'pip install -e ".[dev]"' }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: ${{ matrix.install }}
      - run: python -m pytest -q

  # The web app runs the very same Python in the browser (Pyodide). Render a fixed set of labels in Pyodide and natively
  # and compare the dots, so the two engines can't drift apart unnoticed. Also runs the Node tests of the doodle engine
  # (the other jobs' Node is too old for them, and they skip).
  web-parity:
    name: The web engine draws what the native one does
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Pyodide, the version the site uses
        run: |
          version=$(python -c "import sys; sys.path.insert(0, 'src/dotlab/web'); import dev_server; print(dev_server.PYODIDE)")
          mkdir -p "$RUNNER_TEMP/pyodide" && cd "$RUNNER_TEMP/pyodide" && npm init -y >/dev/null && npm install "pyodide@$version"
      - run: python -m pytest -q tests/test_web_parity.py tests/test_web_js.py
        env:
          DOTLAB_PARITY_PYODIDE: ${{ runner.temp }}/pyodide
